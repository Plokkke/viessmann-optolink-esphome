esphome:
  name: controlleur-chaudiere
  friendly_name: Controlleur chaudière

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The super mini chip antenna is poorly matched: lower TX power keeps the link stable
  output_power: 8.5dB
  ap:
    ssid: "Controlleur-Chaudiere"
    password: !secret fallback_ap_password

light:
  - platform: status_led
    name: Status LED
    pin:
      number: GPIO8
      inverted: true

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
    update_interval: 60s
