esphome:
  name: controlleur-chaudiere
  friendly_name: Controlleur chaudière

esp8266:
  board: d1_mini

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Controlleur-Chaudiere"
    password: !secret fallback_ap_password

light:
  - platform: status_led
    name: Status LED
    pin:
      number: GPIO2
      inverted: true

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
    update_interval: 60s
