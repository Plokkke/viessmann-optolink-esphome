packages:
  common: !include common.yaml

# Optolink protocol (P300) and entities: SoulSolistice/esphome_vitohome, pinned to a release tag
external_components:
  - source:
      type: git
      url: https://github.com/SoulSolistice/esphome_vitohome
      ref: v0.6
    components: [vitohome]

# Logs over native USB, so the UART stays dedicated to the Optolink
logger:
  hardware_uart: USB_SERIAL_JTAG

# 4800 baud, 8E2: the Optolink line settings, enforced by vitohome
uart:
  - id: optolink_uart
    tx_pin: GPIO4
    rx_pin: GPIO3
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 2

# Vitotronic 200 HO1B (20CB): addresses and confidence in knowledge/datapoints-optolink.md.
# Not synced on purpose: the controller clock (writing it is ruled out, see knowledge/architecture.md).
vitohome:
  id: vito
  uart_id: optolink_uart
  protocol: P300
  update_interval: 10s

# Failsafe: without Home Assistant for 30 min, hand heating back to the controller's own schedule
api:
  reboot_timeout: 0s
  on_client_connected:
    - script.stop: failsafe
  on_client_disconnected:
    - script.execute: failsafe

esphome:
  on_boot:
    - script.execute: failsafe

script:
  - id: failsafe
    mode: single
    then:
      - delay: 30min
      - logger.log:
          level: WARN
          format: "Home Assistant unreachable for 30 min, restoring 'Heating and hot water'"
      - select.set:
          id: operation_mode
          option: Heating and hot water

# Heating circuit 1 as a thermostat card: room setpoint and operating mode as presets.
# The mode is written at 0x2323 and read back at 0x2301 (the mode actually set, panel included).
climate:
  - platform: vitohome
    name: Heating
    target_address: 0x2306
    visual:
      min_temperature: 3
      max_temperature: 37
      temperature_step: 1
    operating_mode:
      address: 0x2323
      state_address: 0x2301
      presets:
        - {name: "Heating and hot water", write: 0x02, read: [0x03], mode: heat}
        - {name: "Permanently normal", write: 0x04, read: [0x02], mode: heat}
        - {name: "Permanently reduced", write: 0x03, read: [0x01], mode: heat}
        - {name: "Only hot water", write: 0x01, read: [0x00], mode: "off"}
        - {name: "Off", write: 0x00, read: [0x05], mode: "off"}

sensor:
  - platform: vitohome
    name: Boiler Temperature
    address: 0xA309
    length: 2
    converter: div100
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 40s
  - platform: vitohome
    name: Boiler setpoint
    address: 0x555A
    length: 2
    converter: div10
    unit_of_measurement: °C
    device_class: temperature
    update_interval: 60s
  - platform: vitohome
    name: Outdoor temperature
    address: 0x5525
    length: 2
    converter: div10
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 300s
  - platform: vitohome
    name: Flow setpoint
    address: 0x2544
    length: 2
    converter: div10
    unit_of_measurement: °C
    device_class: temperature
    update_interval: 120s
  - platform: vitohome
    name: Hot water temperature
    address: 0x0812
    length: 2
    converter: div10
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
  - platform: vitohome
    name: Flue gas temperature
    address: 0x0816
    length: 2
    converter: div10
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 70s
  - platform: vitohome
    name: Burner power
    address: 0xA38F
    length: 1
    converter: div2
    signed: false
    unit_of_measurement: "%"
    state_class: measurement
    update_interval: 30s
  - platform: vitohome
    name: Burner starts
    address: 0x088A
    length: 4
    converter: noconv
    state_class: total_increasing
    update_interval: 1800s
  - platform: vitohome
    name: Burner hours
    address: 0x08A7
    length: 4
    converter: sec2hour
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    update_interval: 1800s
  # Coding A0 (heating circuit 1): 0 = no remote control, 1 = Vitotrol 200, 2 = Vitotrol 300
  - platform: vitohome
    name: Remote control coding A0
    address: 0x27A0
    length: 1
    converter: noconv
    entity_category: diagnostic
    update_interval: 1800s
  # 0 = the controller's own room setpoint applies
  - platform: vitohome
    name: External room temperature setpoint
    address: 0x2321
    length: 1
    converter: noconv
    unit_of_measurement: °C
    device_class: temperature
    update_interval: 300s

binary_sensor:
  - platform: vitohome
    type: connectivity
    name: Optolink
  - platform: vitohome
    name: Disturbance
    address: 0x0A82
    device_class: problem
    update_interval: 40s
  - platform: vitohome
    name: Burner
    address: 0x55D3
    device_class: heat
    update_interval: 20s
  - platform: vitohome
    name: Internal pump
    address: 0x7660
    device_class: running
    update_interval: 40s
  - platform: vitohome
    name: Hot water charging pump
    address: 0x6513
    device_class: running
    update_interval: 50s

number:
  - platform: vitohome
    name: Reduced room temperature setpoint
    address: 0x2307
    length: 1
    converter: noconv
    unit_of_measurement: °C
    device_class: temperature
    min_value: 3
    max_value: 37
    step: 1
    mode: box
    update_interval: 300s
  - platform: vitohome
    name: Hot water setpoint
    address: 0x6300
    length: 1
    converter: noconv
    unit_of_measurement: °C
    device_class: temperature
    min_value: 10
    max_value: 60
    step: 1
    mode: box
    update_interval: 300s
  - platform: vitohome
    name: Heating curve slope
    address: 0x27D3
    length: 1
    converter: div10
    min_value: 0.2
    max_value: 3.5
    step: 0.1
    mode: box
    entity_category: config
    update_interval: 1800s
  - platform: vitohome
    name: Heating curve level
    address: 0x27D4
    length: 1
    converter: noconv
    signed: true
    unit_of_measurement: K
    min_value: -13
    max_value: 40
    step: 1
    mode: box
    entity_category: config
    update_interval: 1800s

switch:
  - platform: vitohome
    name: Economy mode
    address: 0x2331
    icon: mdi:sprout-outline
    update_interval: 100s

# The mode as the controller stores it (read and written at 0x2323); the failsafe sets it
select:
  - platform: vitohome
    id: operation_mode
    name: Operation mode
    address: 0x2323
    length: 1
    update_interval: 50s
    options:
      0x00: "Off"
      0x01: "Only hot water"
      0x02: "Heating and hot water"
      0x03: "Permanently reduced"
      0x04: "Permanently normal"

text_sensor:
  - platform: vitohome
    type: device_id
    name: Device Info
    entity_category: diagnostic
  - platform: vitohome
    type: raw
    name: Extended identification
    address: 0x00F0
    length: 1
    entity_category: diagnostic
    update_interval: 1800s
  - platform: vitohome
    type: enum
    name: Heating state
    address: 0x2500
    length: 1
    update_interval: 70s
    options:
      0x00: "Off"
      0x01: "Reduced"
      0x02: "Normal"
      0x03: "Permanently normal"
  - platform: vitohome
    type: enum
    name: Hot water charging state
    address: 0x650A
    length: 1
    update_interval: 30s
    options:
      0x00: "Idle"
      0x01: "Charging"
      0x02: "Overrun"
  # Fault history slot 1: fault code and its BCD timestamp
  - platform: vitohome
    type: error_history
    name: Last error
    address: 0x7590
    entity_category: diagnostic
    update_interval: 1800s

button:
  - platform: vitohome
    name: Refresh boiler values
    entity_category: diagnostic
